# Save as .github/workflows/tides.yml
# Add your Admiralty key under Settings > Secrets and variables > Actions as UKHO_KEY.
name: Update tides
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-tides.mjs
        env:
          UKHO_KEY: ${{ secrets.UKHO_KEY }}
      - run: |
          git config user.name "tide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tides.json
          git diff --cached --quiet || git commit -m "Update tides"
          git push
